name: Build Windows installer

# Personal fork Windows build. Upstream runs on Blacksmith runners that do not
# exist in this fork, so this uses a GitHub-hosted Windows runner instead.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    name: Windows (NSIS installer)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # node-pty and related native dependencies need the Spectre-mitigated
      # libraries that are optional in the GitHub-hosted Windows image.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build Windows installer
        run: vp run dist:desktop:win

      # The installer goes to a release rather than a workflow artifact: release
      # assets are public and permanent, while artifacts expire in 30 days, need
      # `gh` or a signed-in browser, and count against the Actions storage quota.
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 8)
          $tag = "build-$short"
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "No installer in release\"; exit 1 }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; uploading assets."
          } else {
            gh release create $tag --repo "${{ github.repository }}" --target $sha `
              --title "Build $short" --notes "Windows x64 installer built from ${sha}." --latest=false
          }
          gh release upload $tag $exe.FullName --repo "${{ github.repository }}" --clobber

      # Unbounded builds would leave a 160 MB installer per release forever.
      - name: Keep the 2 newest build releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=2
          # Newest first, so everything past the first two goes.
          tags=$(gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^build-')
          stale=$(printf '%s\n' "$tags" | tail -n +$((keep + 1)))
          if [[ -z "$stale" ]]; then
            echo "Only $(printf '%s\n' "$tags" | grep -c . || true) build release(s); nothing to prune."
            exit 0
          fi
          for tag in $stale; do
            echo "Deleting $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
